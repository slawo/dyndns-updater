version: 2
project_name: dyndns-updater
builds:
  - id: linux
    main: .
    binary: dyndns-updater
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux]
    goarch: ["386", amd64, arm, arm64, loong64, ppc64le, riscv64, s390x]
    goarm: ["6", "7"]
  - id: desktop
    main: .
    binary: dyndns-updater
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [darwin, windows, freebsd, openbsd]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - urls.txt
      - deploy/dyndns-updater.service
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  mode: keep-existing
