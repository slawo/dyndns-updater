name: test
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o /tmp/dyndns-updater .
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version-file: .tool-versions
          args: check
      - name: Build release snapshot
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Check image handoff
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          bash .github/scripts/prepare-images.sh "$version"
      - name: Build local image
        run: docker build --platform linux/amd64 -t dyndns-updater:ci .
      - name: Check image entrypoint
        run: |
          status=0
          docker run --rm dyndns-updater:ci > /tmp/image-startup.log 2>&1 || status=$?
          test "$status" -eq 1
          grep -q DYNDNS_UPDATE_URL /tmp/image-startup.log
