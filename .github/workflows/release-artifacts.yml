name: release-artifacts
on:
  workflow_call:
    inputs:
      release-version:
        required: true
        type: string
      release-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-release-binaries:
    if: github.repository == 'slawo/dyndns-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.release-version }}
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: ./.github/actions/setup-go
        with:
          workload: release-build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version-file: .tool-versions
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release-sha }}-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  buildx-release-docker:
    if: github.repository == 'slawo/dyndns-updater'
    needs: build-release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set repository variable DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set repository secret DOCKERHUB_TOKEN"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release-sha }}-binaries
          path: dist
          digest-mismatch: error
      - name: Prepare released binaries
        id: prepare
        env:
          RELEASE_TAG: ${{ inputs.release-version }}
        run: |
          bash .github/scripts/prepare-images.sh "${RELEASE_TAG#v}"
          echo "platforms=$(paste -sd, .github/image-platforms.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          context: git
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/dyndns-updater
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.release-sha }}
            type=semver,pattern={{version}},value=${{ inputs.release-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-version }}
            type=semver,pattern={{major}},value=${{ inputs.release-version }},enable=${{ !startsWith(inputs.release-version, 'v0.') }}
            type=semver,pattern=v{{version}},value=${{ inputs.release-version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.release-version }}
            type=semver,pattern=v{{major}},value=${{ inputs.release-version }},enable=${{ !startsWith(inputs.release-version, 'v0.') }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release-sha }}
            org.opencontainers.image.version=${{ inputs.release-version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: ${{ steps.prepare.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=image-release
            type=gha,scope=image-ci-amd64
          cache-to: type=gha,scope=image-release,mode=max
      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest Docker Hub image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/dyndns-updater
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
